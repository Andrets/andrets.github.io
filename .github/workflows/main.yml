on:
  push:
    branches: ["gh-pages"] # Запуск при пуше в основную ветку

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out' # УКАЖИТЕ ВАШУ ПАПКУ ТУТ

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
